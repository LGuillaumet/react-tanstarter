services:
  db:
    image: postgres:alpine
    ports:
      - 5432:5432
    volumes:
      - postgres_data_tanstarter:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=tanstarter

  bot-discord-patate:
    build:
      context: ../bot-discord-patate
      dockerfile: Dockerfile
    ports:
      - 3001:3001
    env_file:
      - ../bot-discord-patate/.env
    depends_on:
      - db

volumes:
  postgres_data_tanstarter:
